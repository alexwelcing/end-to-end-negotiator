<!doctype html><html><head><meta charset="utf-8"><style>
body{font-family:-apple-system,Helvetica,sans-serif;background:#f6f7f9;margin:0;display:grid;place-items:center;height:100vh}
.card{background:#fff;border-radius:16px;padding:28px 36px;box-shadow:0 8px 30px rgba(0,0,0,.08);width:420px}
h1{font-size:18px;margin:0 0 4px;color:#111}.sub{color:#888;font-size:13px;margin-bottom:22px}
.track{height:6px;border-radius:3px;background:#e5e5ea;position:relative;margin:30px 10px 10px}
.fill{position:absolute;left:0;top:0;height:6px;width:50%;background:#0a66ff;border-radius:3px}
.thumb{position:absolute;left:50%;top:-9px;width:24px;height:24px;margin-left:-12px;border-radius:12px;background:#fff;border:1px solid #ccc;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.ticks{display:flex;justify-content:space-between;color:#999;font-size:12px;margin:0 6px}
.readout{text-align:center;font-size:22px;font-weight:600;color:#111;margin-top:14px}
.hint{color:#888;font-size:12px;text-align:center;margin-top:6px}
</style></head><body><div class="card"><h1>Volume</h1><div class="sub">Drag the handle to set volume, in steps of 10</div>
<div class="track"><div class="fill"></div><div class="thumb"></div></div>
<div class="ticks"><span>0</span><span>50</span><span>100</span></div>
<div class="readout">50</div><div class="hint">Muted at 0 · Max 100</div>
</div></body></html>
