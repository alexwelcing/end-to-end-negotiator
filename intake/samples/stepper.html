<!doctype html><html><head><meta charset="utf-8"><style>
body{font-family:-apple-system,Helvetica,sans-serif;background:#f6f7f9;margin:0;display:grid;place-items:center;height:100vh}
.card{background:#fff;border-radius:16px;padding:28px 36px;box-shadow:0 8px 30px rgba(0,0,0,.08);width:380px}
h1{font-size:18px;margin:0 0 6px;color:#111}.sub{color:#888;font-size:13px;margin-bottom:18px}
.stepper{display:flex;align-items:center;gap:18px;justify-content:center;margin:16px 0}
button{width:48px;height:48px;border-radius:12px;border:1px solid #ddd;background:#fafafa;font-size:24px;color:#222}
button[disabled]{color:#bbb;background:#f2f2f2}
.val{font-size:44px;font-weight:600;min-width:70px;text-align:center;color:#111}
.foot{display:flex;justify-content:space-between;color:#666;font-size:13px;border-top:1px solid #eee;padding-top:12px;margin-top:12px}
.reset{color:#0a66ff;font-weight:500}
</style></head><body><div class="card"><h1>Guests</h1><div class="sub">Choose between 1 and 8 guests</div>
<div class="stepper"><button disabled>−</button><div class="val">1</div><button>+</button></div>
<div class="foot"><span>Minimum 1, maximum 8</span><span class="reset">Reset</span></div>
</div></body></html>
