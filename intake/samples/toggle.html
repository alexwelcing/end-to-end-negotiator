<!doctype html><html><head><meta charset="utf-8"><style>
body{font-family:-apple-system,Helvetica,sans-serif;background:#f6f7f9;margin:0;display:grid;place-items:center;height:100vh}
.card{background:#fff;border-radius:16px;padding:32px 40px;box-shadow:0 8px 30px rgba(0,0,0,.08);width:360px}
h1{font-size:18px;margin:0 0 18px;color:#111}
.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid #eee}
.label{color:#333;font-size:15px}.sub{color:#888;font-size:12px}
.switch{width:52px;height:30px;border-radius:15px;background:#ccc;position:relative}
.switch.on{background:#34c759}.knob{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:12px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch.on .knob{left:25px}
</style></head><body><div class="card"><h1>Notifications</h1>
<div class="row"><div><div class="label">Push notifications</div><div class="sub">Currently: On</div></div><div class="switch on"><div class="knob"></div></div></div>
</div></body></html>
