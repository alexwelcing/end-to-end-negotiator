[project]
name = "nerve"
version = "0.1.0"
description = "Software without code: describe an interface, get a network that is the program."
requires-python = ">=3.11"
dependencies = ["torch>=2.2", "numpy>=1.26", "pyyaml>=6", "zstandard>=0.22"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
nerve = "nerve.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nerve*"]
