# Builds the static lab (the WebAssembly core, the pages, the specs, the machines and the served networks)
# and deploys it to Cloudflare as a static-assets Worker (site/wrangler.toml) on every push to `nerve`.
# Set up once: the repository variable CF_DEPLOY (any value) and the secrets CLOUDFLARE_API_TOKEN (Workers
# scripts edit scope) and CLOUDFLARE_ACCOUNT_ID. Without the variable the job is skipped, and
# `python scripts/build_site.py` followed by `wrangler deploy --config site/wrangler.toml` does the same by hand.
name: deploy site to cloudflare

on:
  push:
    branches: [nerve]
  workflow_dispatch:

jobs:
  site:
    runs-on: ubuntu-latest
    if: ${{ vars.CF_DEPLOY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/wasm-bindgen-action@v0.2.0
        with:
          version: "0.2.114"
      - name: Build the site
        run: cargo run --release -p nerve --bin nerve -- site
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config site/wrangler.toml
