# Builds the static lab (the WebAssembly core, the pages, the specs, the machines and the served networks)
# and deploys it to Cloudflare Pages on every push to `nerve`.
# Set up once: a Pages project, the repository variable CF_PAGES_PROJECT (its name) and the secrets
# CLOUDFLARE_API_TOKEN (Pages edit scope) and CLOUDFLARE_ACCOUNT_ID. Without the variable the job is skipped,
# and `python scripts/build_site.py` followed by `wrangler pages deploy site/dist` does the same by hand.
name: deploy site to cloudflare pages

on:
  push:
    branches: [nerve]
  workflow_dispatch:

jobs:
  pages:
    runs-on: ubuntu-latest
    if: ${{ vars.CF_PAGES_PROJECT != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/wasm-bindgen-action@v0.2.0
        with:
          version: "0.2.114"
      - name: Build the site
        run: python3 scripts/build_site.py
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/dist --project-name ${{ vars.CF_PAGES_PROJECT }} --branch nerve --commit-dirty=true
