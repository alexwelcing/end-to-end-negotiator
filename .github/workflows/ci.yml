name: ci

on:
  push:
    branches: [nerve, nerve-rs, master]
  pull_request:

jobs:
  rust:
    name: build, test, check every spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (CPU)
        run: cargo build --release --workspace
      - name: Tests
        run: cargo test --release --workspace
      - name: Every spec and machine passes its own check
        run: |
          for s in specs/*.nerve machines/*.nerve; do
            echo "== $s"; ./target/release/nerve check "$s"
          done
      - name: The served models load and answer, and the machine room ticks the chain
        run: |
          ./target/release/nerve serve --models models/served --addr 127.0.0.1:8787 &
          sleep 2
          python3 scripts/ci_smoke.py http://127.0.0.1:8787

  docker:
    name: lab image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: nerve-lab:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
