[package]
name = "nerve"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Nerve in Rust: spec-compiled, JEPA-trained interface networks with Dragology-style drags on the local GPU"

[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda"]

[dependencies]
anyhow = "1"
axum = "0.8"
blake2 = "0.10"
candle-core = "=0.10.2"
candle-nn = "=0.10.2"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
